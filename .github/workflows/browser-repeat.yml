name: Repeat browser regressions
on:
  workflow_dispatch:
    inputs:
      profile_baseline:
        description: Optional baseline commit for a five-pair frame benchmark
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: browser-repeat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repeat-browser:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [rtc, relay, phone, phone-relay, webkit, webkit-relay]
        suite: [journey]
        include:
          - project: rtc
            suite: captions-rematch
            pattern: phone layouts preserve full captions|two players receive decision feedback
          - project: relay
            suite: captions
            pattern: phone layouts preserve full captions
          - project: phone-relay
            suite: captions-rematch
            pattern: phone layouts preserve full captions|two players receive decision feedback
    steps:
      - uses: actions/checkout@v4
      - name: Record tested revision
        run: |
          echo "Diagnostic repetition only; full Verify game checks remain required." >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ startsWith(matrix.project, 'webkit') && 'webkit' || 'chrome' }}
      - name: Repeat focused gameplay scenarios
        env:
          TEST_PATTERN: ${{ matrix.pattern || 'two players complete a scored match|two players render a long|expanded recovery|short landscape' }}
        run: pnpm test:ui --project=${{ matrix.project }} --grep "$TEST_PATTERN" --repeat-each=10 --retries=0
      - name: Summarize browser attempts
        if: always()
        run: node scripts/browser-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-repeat-${{ matrix.project }}-${{ matrix.suite }}
          path: |
            output/playwright/results.json
            output/playwright/results/
            output/playwright/ready-together/after/*.png
            output/playwright/recovery-ownership/after/*.png
          if-no-files-found: ignore
          retention-days: 14

  frame-profile:
    if: inputs.profile_baseline != ''
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.profile_baseline }}
          path: baseline
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: candidate/.node-version
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - working-directory: baseline
        run: pnpm install --frozen-lockfile --prod=false && pnpm build
      - working-directory: candidate
        run: pnpm install --frozen-lockfile --prod=false && pnpm build
      - working-directory: candidate
        run: pnpm exec playwright install --with-deps chrome
      - working-directory: candidate
        id: comparison
        run: pnpm profile:game --app-root ../baseline --compare-root . --runs 5 --output output/profile/comparison.json
      - name: Capture diagnostic CPU profiles outside the timed comparison
        if: ${{ !cancelled() && steps.comparison.outcome != 'skipped' }}
        working-directory: candidate
        run: pnpm profile:game --app-root ../baseline --compare-root . --cpu-profile --runs 1 --output output/profile/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-profile
          path: candidate/output/profile/
          if-no-files-found: warn
          retention-days: 14
